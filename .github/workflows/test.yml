name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tests/strip-emoji.test.js imports scripts/seo-helpers.js, which pulls in
      # @supabase/supabase-js — that lives in scripts/package.json, not the root.
      - name: Install scripts deps
        working-directory: ./scripts
        run: npm install
      - run: npm test

  generator-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install scripts deps
        working-directory: ./scripts
        run: npm install
      - run: npm run test:generators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: No raw placeholders across corpus
        run: npm run test:placeholders

  integrity-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install scripts deps
        working-directory: ./scripts
        run: npm install
      - run: npm run test:integrity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # E2E hits live site (battle.html Realtime, Supabase) — flaky.
    # Don't gate PRs on it; surface failures separately.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test
        env:
          BASE_URL: https://stickerhunt.club
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # 2026-08-19: {{CLUB_NAME_RAW}} broke generator-tests at 09:10 and nothing
  # said so for 7h20m — until it took the live image pipeline down with it.
  # Same alert reconcile-images.yml / reconcile-stickers.yml already carry.
  notify-failure:
    needs: [unit-tests, generator-tests, integrity-tests, e2e-tests]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Alert on failure
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: '292048'
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "no TELEGRAM_BOT_TOKEN, skip"; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🔴 StickerHunt CI ЧЕРВОНИЙ на main: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
