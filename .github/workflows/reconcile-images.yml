name: Reconcile Missing Optimized Images

on:
  schedule:
    # Every 5 minutes. This is now the ONLY healer for stickers whose
    # generate-sticker-pages run was evicted from the concurrency queue — the
    # in-run safety-net was removed on 2026-08-16 because it competed with
    # browser uploads for Storage connections. A missing _web.webp is a broken
    # image on a live page (img-proxy has no fallback), and GitHub's scheduler
    # is best-effort, so the interval is short. Total load still drops: the
    # window below narrowed from 7 days to 1, so each run does far fewer checks.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Check stickers from last N days (default 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: reconcile-images
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Optimize missing images
        working-directory: ./scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          node optimize-images.js --missing-only --days=$DAYS

      # Now that this is the only healer for missing optimized images, a silent
      # failure means broken images on live pages with nothing to notice it.
      # Same alert reconcile-stickers.yml already carries.
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: '292048'
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "no TELEGRAM_BOT_TOKEN, skip"; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🔴 StickerHunt reconcile-images ЗЛАМАВСЯ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
